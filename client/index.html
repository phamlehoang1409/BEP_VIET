<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bếp Việt Gourmet - Đặt Món Ăn Nóng Hổi & Giao Nhanh</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#FF5722" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bếp Việt" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>" />

    <!-- Google Fonts: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Khóa click chuột phải, F11 & DevTools ngay từ lúc bắt đầu tải DOM -->
    <script>
      (function() {
        function blockEvent(e) {
          if (!e) e = window.event;
          if (e) {
            try { if (e.preventDefault) e.preventDefault(); } catch (err) {}
            try { if (e.stopPropagation) e.stopPropagation(); } catch (err) {}
            try { if (e.stopImmediatePropagation) e.stopImmediatePropagation(); } catch (err) {}
            e.returnValue = false;
          }
          return false;
        }

        // Khóa bất biến thuộc tính oncontextmenu chống extension ghi đè
        try {
          Object.defineProperty(document, 'oncontextmenu', {
            get: function() { return blockEvent; },
            set: function() { return false; },
            configurable: false
          });
          Object.defineProperty(window, 'oncontextmenu', {
            get: function() { return blockEvent; },
            set: function() { return false; },
            configurable: false
          });
        } catch (err) {
          document.oncontextmenu = blockEvent;
          window.oncontextmenu = blockEvent;
        }

        // Bắt và hủy toàn bộ sự kiện click chuột phải ở cả 2 pha Capture và Bubble
        ['contextmenu', 'auxclick'].forEach(function(evt) {
          window.addEventListener(evt, blockEvent, true);
          document.addEventListener(evt, blockEvent, true);
          window.addEventListener(evt, blockEvent, false);
          document.addEventListener(evt, blockEvent, false);
        });

        // Bắt chuột phải qua mousedown, mouseup, pointerdown (button 2)
        ['mousedown', 'mouseup', 'pointerdown', 'pointerup'].forEach(function(evt) {
          window.addEventListener(evt, function(e) {
            if (e && (e.button === 2 || e.which === 3)) {
              blockEvent(e);
            }
          }, true);
          document.addEventListener(evt, function(e) {
            if (e && (e.button === 2 || e.which === 3)) {
              blockEvent(e);
            }
          }, true);
        });

        // Khóa phím F11 (Fullscreen), F12 (Inspect DevTools), Ctrl+Shift+I/J/C, Ctrl+U (View Source)
        window.addEventListener('keydown', function(e) {
          if (e.key === 'F11' || e.code === 'F11' || e.keyCode === 122) return blockEvent(e);
          if (e.key === 'F12' || e.code === 'F12' || e.keyCode === 123) return blockEvent(e);
          if (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].indexOf(e.key) !== -1) return blockEvent(e);
          if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) return blockEvent(e);
          if (e.ctrlKey && (e.key === 's' || e.key === 'S')) return blockEvent(e);
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-slate-800 antialiased selection:bg-orange-500 selection:text-white select-none" oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Automatic Service Worker cleanup and registration with cache busting
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?t=' + Date.now()).then((reg) => {
            reg.update();
          }).catch(err => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
