<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bếp Việt Gourmet - Đặt Món Ăn Nóng Hổi & Giao Nhanh</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#FF5722" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bếp Việt" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>" />

    <!-- Google Fonts: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF8F5] text-slate-800 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Khóa phím F11 trên toàn bộ trang web
      window.addEventListener('keydown', function(e) {
        if (e.key === 'F11' || e.code === 'F11' || e.keyCode === 122) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Automatic Service Worker cleanup and registration with cache busting
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?t=' + Date.now()).then((reg) => {
            reg.update();
          }).catch(err => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
